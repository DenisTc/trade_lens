name: tradelens
description: TradeLens · live crypto quotes, portfolio and AI move summaries. No backend.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ai_insights:
  app_links: ^7.2.1
  core:
  data_config:
  data_local:
  data_market:
  domain:
  features_insights:
  features_markets:
  features_portfolio:
  features_settings:
  features_shared:
  firebase_core: ^4.14.0
  firebase_remote_config: ^6.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  package_info_plus: ^10.2.1
  riverpod_annotation: ^4.0.7
  sdui:
  sentry_flutter: ^9.29.0
  ws_client:

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  # Pinned as a pair with patrol_cli in CI (spec, «Тесты»).
  patrol: 4.9.0
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

patrol:
  app_name: TradeLens
  android:
    package_name: com.denistc.tradelens
  ios:
    bundle_id: com.denistc.tradelens
