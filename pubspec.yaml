name: tradelens_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - packages/core
  - packages/domain
  - packages/data_market
  - packages/data_local
  - packages/data_config
  - packages/ws_client
  - packages/chart
  - packages/sdui
  - packages/ai_insights
  - packages/features/shared
  - packages/features/markets
  - packages/features/portfolio
  - packages/features/insights
  - packages/features/settings
  - apps/mobile
  - tooling/ai_review
  - tooling/arch_test
dev_dependencies:
  melos: ^8.6.0
melos:
  scripts:
    generate:
      description: gen-l10n for the shared strings, then build_runner in every package that depends on it.
      run: melos exec --scope=features_shared -- flutter gen-l10n && melos exec -c 1 --depends-on build_runner -- dart run build_runner build --delete-conflicting-outputs
    analyze:
      description: Static analysis, infos are fatal.
      run: melos exec -- dart analyze --fatal-infos .
    format:
      description: Formatting check for the workspace sources (build output, which holds vendored plugin sources after an iOS build, is not ours to format).
      run: sh tooling/scripts/format.sh --set-exit-if-changed
    test:
      description: Run tests with coverage in every package that has a test dir (goldens excluded, see test:golden).
      run: melos exec --dir-exists test -- flutter test --coverage --exclude-tags golden
    test:golden:
      description: Golden tests only, in packages that ship a flutter_test_config.dart. Regenerate with `melos run test:golden -- --update-goldens` on macOS.
      run: melos exec --file-exists test/flutter_test_config.dart -- flutter test --tags golden
