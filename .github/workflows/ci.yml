name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  build:
    name: analyze · test · apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ steps.fvm.outputs.version }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ steps.fvm.outputs.version }}-

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
          "$PUB_CACHE/bin/melos" bootstrap --enforce-lockfile

      - name: Firebase configuration (stub unless secrets are set)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          [ -n "$FIREBASE_OPTIONS_DART" ] && printf '%s' "$FIREBASE_OPTIONS_DART" | base64 -d > apps/mobile/lib/firebase_options.dart || true
          [ -n "$GOOGLE_SERVICES_JSON" ] && printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > apps/mobile/android/app/google-services.json || true
          [ -n "$GOOGLE_SERVICE_INFO_PLIST" ] && printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > apps/mobile/ios/Runner/GoogleService-Info.plist || true
          sh tooling/scripts/firebase_stub.sh

      - name: Generate code
        run: melos run generate

      - name: Format check
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Test with coverage (goldens run in their own job)
        run: melos run test

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define-from-file=../../env.example.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradelens-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: warn

  golden:
    name: golden tests (macOS)
    # Goldens are rendered on macOS: text anti-aliasing differs between
    # macOS and Linux by a fraction of a percent, enough to fail pixel
    # comparison. Developers regenerate goldens on macOS too.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
          "$PUB_CACHE/bin/melos" bootstrap --enforce-lockfile
          "$PUB_CACHE/bin/melos" run generate

      # Golden tests are tagged `golden` and live only in packages that ship a
      # flutter_test_config.dart (font loading, day 4). Filtering on that file
      # avoids "no tests match tag" failures in packages without goldens.
      - name: Run golden tests
        run: melos exec --file-exists test/flutter_test_config.dart -- flutter test --tags golden

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/test/**/failures/**'
          if-no-files-found: ignore

  e2e:
    name: patrol e2e (iOS simulator)
    # The scenarios drive the live network, so they run on main and on any
    # pull request labelled `e2e` rather than on every push.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ steps.fvm.outputs.version }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ steps.fvm.outputs.version }}-

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
          "$PUB_CACHE/bin/melos" bootstrap --enforce-lockfile

      - name: Firebase configuration (stub unless secrets are set)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          [ -n "$FIREBASE_OPTIONS_DART" ] && printf '%s' "$FIREBASE_OPTIONS_DART" | base64 -d > apps/mobile/lib/firebase_options.dart || true
          [ -n "$GOOGLE_SERVICE_INFO_PLIST" ] && printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > apps/mobile/ios/Runner/GoogleService-Info.plist || true
          sh tooling/scripts/firebase_stub.sh

      - name: Generate code
        run: melos run generate

      # Pinned: patrol_cli and the patrol package must stay a matching pair
      # (spec, "Тесты"). Bump both together.
      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
          "$PUB_CACHE/bin/patrol" --version

      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPhone 1[5-9]")) | .udid' | head -n1)
          echo "Booting $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run e2e scenarios
        working-directory: apps/mobile
        run: patrol test --target integration_test/app_test.dart -d ${{ steps.sim.outputs.udid }}

      - name: Upload xcresult bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-xcresult
          path: apps/mobile/build/ios_results_*.xcresult
          if-no-files-found: ignore
