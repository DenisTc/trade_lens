name: features_shared
description: TradeLens · features_shared package.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  clock: ^1.1.3
  core:
  domain:
  flutter: 
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_test:
    sdk: flutter
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7
dev_dependencies:
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
